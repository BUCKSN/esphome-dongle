# Релиз запускается кнопкой в разделе Actions. Версия берётся из даты и времени UTC.
# Переменная репозитория AUX_AC_REPO задаёт форк aux_ac, если он называется иначе.
name: Release firmware
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  firmware:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: esphome-dongle
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.AUX_AC_REPO || 'BUCKSN/esphome_aux_ac_component' }}
          ref: extra-bits
          path: esphome_aux_ac_component
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install "esphome==2026.10.1"
      - id: version
        run: echo "version=$(date -u +%Y.%m.%d-%H%M)" >> "$GITHUB_OUTPUT"
      - name: Build
        run: >
          esphome -s fw_version "${{ steps.version.outputs.version }}"
          -s project_url "https://github.com/${{ github.repository }}"
          compile esphome-dongle/devices/ac-aux.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            esphome-dongle/devices/.esphome/build/esphome-dongle/build/firmware.ota.bin
            esphome-dongle/devices/.esphome/build/esphome-dongle/build/firmware.factory.bin
  flasher:
    needs: firmware
    strategy:
      # Сбой одной сборки не должен отменять остальные.
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, name: linux-x64, sep: ":"}
          - {os: ubuntu-24.04-arm, name: linux-arm64, sep: ":"}
          - {os: windows-2025, name: windows-x64, sep: ";"}
          - {os: windows-11-arm, name: windows-arm64, sep: ";"}
          - {os: macos-15-intel, name: macos-x64, sep: ":"}
          - {os: macos-15, name: macos-arm64, sep: ":"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: fw
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # cryptography нужен esptool только для шифрования образов, а на Windows ARM он не ставится.
      - name: Install tools
        shell: bash
        run: |
          pip install --no-deps "esptool==5.6.0"
          pip install pyinstaller pyserial "reedsolo>=1.5.3,<1.8" PyYAML intelhex "rich_click<2" "click<9" "esp-pylib>=1.0.0" websockets
      - name: Build
        shell: bash
        run: >
          pyinstaller --onefile --name "esphome-dongle-flash-${{ matrix.name }}"
          --collect-all esptool --hidden-import serial.tools.list_ports
          --add-data "fw/firmware.factory.bin${{ matrix.sep }}."
          tools/flash.py
      - uses: actions/upload-artifact@v4
        with:
          name: flasher-${{ matrix.name }}
          path: dist/*
  publish:
    needs: [firmware, flasher]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Publish
        env:
          V: ${{ needs.firmware.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release
          cp out/firmware/firmware.ota.bin "release/esphome-dongle-ac-aux-$V.ota.bin"
          cp out/firmware/firmware.factory.bin "release/esphome-dongle-ac-aux-$V.factory.bin"
          cp out/flasher-*/* release/
          # Манифест для уведомления об обновлении в Home Assistant.
          OTA="esphome-dongle-ac-aux-$V.ota.bin"
          MD5=$(md5sum "release/$OTA" | cut -d" " -f1)
          URL="https://github.com/${{ github.repository }}/releases/download/v$V"
          cat > release/esphome-dongle-ac-aux.manifest.json <<JSON
          {"name":"esphome-dongle","version":"$V","builds":[{"chipFamily":"ESP32-C3","ota":{"path":"$URL/$OTA","md5":"$MD5","release_url":"https://github.com/${{ github.repository }}/releases/tag/v$V","summary":"esphome-dongle $V"}}]}
          JSON
          (cd release && sha256sum * > SHA256SUMS.txt)
          gh release create "v$V" --generate-notes release/*
